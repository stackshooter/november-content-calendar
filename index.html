<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StackShooter Content Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style id="app-css">
      :root {
        /* Brand world: StackShooter charcoal + logo blue, one dark theme. Layout: header + stats, toolbar, 7-col month grid (week list on phones), editor sheet. */
        --bg: #14171b;
        --surface: #1b1f25;
        --surface-2: #232830;
        --line: #2e343d;
        --text: #edf0f4;
        --muted: #98a2b1;
        --faint: #6b7584;
        --accent: #3d7bff;
        --accent-2: #86adff;
        --accent-soft: rgba(61, 123, 255, 0.14);
        --reel: #ff6b81;
        --carousel: #5b8cff;
        --caption: #f2b64c;
        --idea: #8a94a3;
        --drafting: #c99bff;
        --ready: #5fd0e8;
        --posted: #3fcb84;
        --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
        --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
        --r: 14px;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 1320px;
        margin: 0 auto;
        padding: 28px 24px 64px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      /* header */
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font: 700 15px var(--font-display);
        letter-spacing: 0.01em;
      }
      .brand b {
        color: var(--accent-2);
        font-weight: 700;
      }
      .brand .sep {
        color: var(--faint);
        font-weight: 500;
      }
      .brand .sub {
        color: var(--muted);
        font: 600 13px var(--font-body);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .mark {
        width: 26px;
        height: 26px;
        flex: none;
      }
      .hero {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
      }
      h1 {
        font: 800 clamp(28px, 4.2vw, 44px)/1.08 var(--font-display);
        margin: 10px 0 8px;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      h1 em {
        font-style: normal;
        color: var(--accent-2);
      }
      .lede {
        color: var(--muted);
        max-width: 62ch;
        margin: 0;
      }
      .platforms {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .plat {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        background: var(--surface);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .stat .k {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .stat .v {
        font: 800 28px/1 var(--font-display);
        font-variant-numeric: tabular-nums;
      }
      .stat .v small {
        font: 600 14px var(--font-body);
        color: var(--muted);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .bar {
        height: 6px;
        border-radius: 6px;
        background: var(--surface-2);
        overflow: hidden;
        margin-top: 6px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--posted);
        border-radius: 6px;
      }

      /* toolbar */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .tgroup {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .seg {
        display: inline-flex;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 3px;
      }
      .seg button {
        border: 0;
        background: none;
        padding: 7px 14px;
        border-radius: 7px;
        font-weight: 700;
        font-size: 13px;
        color: var(--muted);
      }
      .seg button[aria-pressed="true"] {
        background: var(--surface-2);
        color: var(--text);
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--text);
        background: var(--accent-soft);
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 700;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn:hover {
        border-color: var(--faint);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn.primary:hover {
        background: #2f6af0;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .savechip {
        font-size: 12px;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      /* format + status pills */
      .fmt {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .fmt.Reel {
        color: var(--reel);
        background: rgba(255, 107, 129, 0.12);
      }
      .fmt.Carousel {
        color: var(--carousel);
        background: rgba(91, 140, 255, 0.14);
      }
      .fmt.Caption {
        color: var(--caption);
        background: rgba(242, 182, 76, 0.13);
      }
      .st {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .st .dot {
        width: 8px;
        height: 8px;
      }

      /* calendar */
      .cal {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 10px;
      }
      .dow {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 0 4px;
      }
      .cell {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: left;
        min-width: 0;
        transition:
          border-color 0.15s,
          transform 0.15s;
      }
      button.cell:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .cell.empty {
        background: transparent;
        border-style: dashed;
        opacity: 0.45;
      }
      .cell.dim {
        opacity: 0.28;
      }
      .cell .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .dnum {
        font: 800 18px var(--font-display);
        font-variant-numeric: tabular-nums;
      }
      .thumb {
        width: 100%;
        aspect-ratio: 4/5;
        border-radius: 10px;
        overflow: hidden;
        background: #16191d;
        display: block;
        position: relative;
      }
      .thumb canvas,
      .thumb img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .thumb .own {
        position: absolute;
        left: 6px;
        bottom: 6px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 2px 6px;
        border-radius: 5px;
      }
      .ctitle {
        font-weight: 700;
        font-size: 13px;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .cmeta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        flex-wrap: wrap;
      }
      .ctime {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      /* list */
      .weeks {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .week h2 {
        font: 700 18px var(--font-display);
        margin: 0 0 4px;
      }
      .week p.wsub {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 14px;
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
        text-align: left;
        width: 100%;
        align-items: start;
      }
      .row:hover {
        border-color: var(--accent);
      }
      .row .thumb {
        border-radius: 8px;
      }
      .rbody {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .rhead {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
        font-weight: 600;
      }
      .rhead strong {
        color: var(--text);
        font: 700 14px var(--font-display);
      }
      .rtitle {
        font: 700 16px/1.3 var(--font-display);
        text-wrap: balance;
      }
      .rcta {
        font-size: 13px;
        color: var(--muted);
      }
      .rcta b {
        color: var(--accent-2);
      }

      /* strategy */
      .strategy {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 18px;
      }
      .card h3 {
        font: 700 16px var(--font-display);
        margin: 0 0 10px;
      }
      .card ul {
        margin: 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--muted);
        font-size: 14px;
      }
      .card ul b {
        color: var(--text);
      }
      .kw {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }
      .kw span {
        font: 700 12px var(--font-body);
        letter-spacing: 0.04em;
        background: var(--accent-soft);
        color: var(--accent-2);
        border-radius: 6px;
        padding: 3px 8px;
      }
      .sectitle {
        font: 700 22px var(--font-display);
        margin: 10px 0 0;
      }
      footer {
        color: var(--faint);
        font-size: 13px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
      }

      /* editor */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(5, 7, 10, 0.72);
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .sheet {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        width: min(1080px, 100%);
        max-height: calc(100% - 8px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .shead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      .shead h2 {
        margin: 0;
        font: 700 18px var(--font-display);
      }
      .shead .nav {
        display: flex;
        gap: 6px;
      }
      .icon {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
      }
      .sbody {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 22px;
        padding: 18px;
        overflow: auto;
      }
      .pv {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .pv .thumb {
        border-radius: 12px;
        border: 1px solid var(--line);
      }
      .pv .hint {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
      .pvbtns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tips {
        background: var(--surface-2);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13px;
        color: var(--muted);
      }
      .tips b {
        color: var(--text);
      }
      .tips ul {
        margin: 6px 0 0;
        padding-left: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .form {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px 14px;
        align-content: start;
      }
      .f {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }
      .f.w2 {
        grid-column: span 2;
      }
      .f.w4 {
        grid-column: 1/-1;
      }
      .f label {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .f label span {
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .f input,
      .f select,
      .f textarea {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 11px;
        width: 100%;
      }
      .f textarea {
        resize: vertical;
        line-height: 1.5;
      }
      .f input:focus,
      .f select:focus,
      .f textarea:focus {
        border-color: var(--accent);
        outline: none;
      }
      .statusseg {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .statusseg button {
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 9px;
        padding: 7px 11px;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .statusseg button[aria-pressed="true"] {
        color: var(--text);
        border-color: currentColor;
      }
      .sfoot {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        border-top: 1px solid var(--line);
      }
      .sfoot .note {
        font-size: 12px;
        color: var(--muted);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: #0d0f12;
        border: 1px solid var(--line);
        color: var(--text);
        padding: 10px 16px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        z-index: 40;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        max-width: calc(100% - 32px);
      }
      .hidden {
        display: none !important;
      }

      @media (max-width: 980px) {
        .sbody {
          grid-template-columns: 1fr;
        }
        .pv {
          max-width: 360px;
        }
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 720px) {
        .wrap {
          padding: 20px 16px 48px;
        }
        .toolbar {
          position: static;
        }
        .cal {
          gap: 5px;
        }
        .cell {
          padding: 5px;
          border-radius: 9px;
          gap: 4px;
        }
        .cell .ctitle,
        .cell .cmeta {
          display: none;
        }
        .cell .dnum {
          font-size: 13px;
        }
        .cell .top .fmt {
          display: none;
        }
        .dow {
          font-size: 10px;
          letter-spacing: 0.02em;
          text-align: center;
          padding: 0;
        }
        .scrim {
          padding: 0;
          align-items: stretch;
        }
        .sheet {
          border-radius: 0;
          max-height: none;
          height: 100%;
        }
        .form {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .f.w2 {
          grid-column: 1/-1;
        }
        .row {
          grid-template-columns: 76px 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* v2 additions */
      .series {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent-2);
        background: var(--accent-soft);
        padding: 3px 8px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .rhook {
        font-size: 14px;
        color: var(--text);
        opacity: 0.85;
        font-style: italic;
      }
      .rsolve {
        font-size: 13px;
        color: var(--muted);
      }
      .rsolve b {
        color: var(--text);
        font-weight: 700;
      }
      .form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .sec {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .sec > h3 {
        margin: 0;
        font: 800 12px var(--font-body);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent-2);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sec > h3::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px 14px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 14px;
      }
      .item {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .item .ihead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .item .ihead strong {
        font: 700 14px var(--font-display);
      }
      .item .irow {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 10px;
      }
      .item .f input,
      .item .f textarea {
        background: var(--surface);
      }
      .mini {
        border: 1px solid var(--line);
        background: var(--surface-2);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
      }
      .mini:hover {
        border-color: var(--faint);
      }
      .mini.warn {
        color: #ff8fa0;
      }
      .btnrow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .f label .bad {
        color: #ff8fa0;
      }
      .sched {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .sched th,
      .sched td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .sched th {
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 800;
      }
      .sched td:first-child {
        font-weight: 800;

            } catch (e) {
              return Promise.resolve(null);
            }
          };
          Promise.all([u("artifact"), u("assets"), u("downloads")]).then(
            function (r) {
              caps.artifact = r[0];
              caps.assets = r[1];
              caps.downloads = r[2];
              caps.ready = true;
              saveChip();
            },
          );
        } else {
          caps.ready = true;
          setTimeout(saveChip, 0);
        }
      })();
    </script>
  </body>
